spring:
  application:
    name: smartprocure-backend-test
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartprocure_db}
    username: ${DB_USERNAME:smartprocure_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
