spring:
  application:
    name: smartprocure-backend-test
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartprocure_db?currentSchema=smartprocure}
    username: ${DB_USERNAME:smartprocure_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: smartprocure
  flyway:
    enabled: true
    schemas: smartprocure
    default-schema: smartprocure
    create-schemas: false
    baseline-on-migrate: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000

