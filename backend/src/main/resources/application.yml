# ==============================================================================
# SmartProcure Spring Boot Application Configuration
# ==============================================================================

spring:
  application:
    name: smartprocure-backend

  # Database Datasource (PostgreSQL)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartprocure_db?currentSchema=smartprocure}
    username: ${DB_USERNAME:smartprocure_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SmartProcureHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000

  # Spring Data JPA / Hibernate
  jpa:
    # Strictly validate database schema against entities; Flyway owns migrations
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: smartprocure
        jdbc:
          time_zone: UTC
    open-in-view: false

  # Flyway Schema Migrations
  flyway:
    enabled: true
    schemas: smartprocure
    default-schema: smartprocure
    create-schemas: false
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# SmartProcure Application Security Settings
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
    timeout-ms: ${GEMINI_TIMEOUT_MS:10000}

