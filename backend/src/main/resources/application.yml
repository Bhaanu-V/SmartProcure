# ==============================================================================
# SmartProcure Spring Boot Application Configuration
# ==============================================================================

spring:
  application:
    name: smartprocure-backend

  # Database Datasource (PostgreSQL)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartprocure_db}
    username: ${DB_USERNAME:smartprocure_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SmartProcureHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000

  # Spring Data JPA / Hibernate
  jpa:
    # Strictly validate database schema against entities; Flyway owns migrations
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  # Flyway Schema Migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
